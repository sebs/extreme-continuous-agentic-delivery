name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job widens it for itself.
permissions:
  contents: read

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # No dependencies to install — build.mjs is plain Node by design.
      - name: Build catalog
        run: node site/build.mjs site/dist

      - name: Check the catalog matches the manifest
        run: |
          names=$(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.name).join(' ')")
          for name in $names; do
            if ! grep -q "id=\"$name\"" site/dist/index.html; then
              echo "::error::plugin '$name' is in marketplace.json but missing from the generated catalog"
              exit 1
            fi
          done
          echo "catalog covers all plugins: $names"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Scoped to this job: the build job stays on contents: read.
    permissions:
      pages: write # required by actions/deploy-pages to publish the artifact
      id-token: write # required by actions/deploy-pages to mint the OIDC token Pages verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
