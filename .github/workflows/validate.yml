name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One validation run per ref; a new push makes the in-flight run irrelevant.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests and catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      # The Claude Code CLI is pinned in package-lock.json with integrity
      # hashes, so a CLI release can't turn CI red on its own. Bump it
      # deliberately — bumping is how you find out the plugin schema moved.
      - name: Install pinned tooling
        run: npm ci

      - name: Validate the marketplace manifest
        run: npx claude plugin validate --strict .

      - name: Validate every plugin manifest
        run: |
          for dir in plugins/*/; do
            echo "== $dir"
            npx claude plugin validate --strict "$dir"
          done

      - name: Check the site builds
        run: node site/build.mjs "$RUNNER_TEMP/site"
